name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: pnpm -r lint
      - name: Test
        working-directory: web
        run: pnpm -r test
      - name: Build viewer
        working-directory: web
        run: pnpm --filter @eye/viewer build
      - name: Playwright smoke
        if: hashFiles('web/apps/viewer/e2e/**') != ''
        working-directory: web
        run: |
          pnpm --filter @eye/viewer exec playwright install --with-deps chromium
          pnpm --filter @eye/viewer e2e

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        working-directory: science
        run: uv python install
      - name: Sync
        working-directory: science
        run: uv sync --locked --all-groups
      - name: Lint
        working-directory: science
        run: uv run ruff check .
      - name: Test
        working-directory: science
        run: uv run pytest -q -m "not slow"
