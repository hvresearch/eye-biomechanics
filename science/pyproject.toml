[project]
name = "eyebiomech"
version = "0.1.0"
description = "Corneoscleral finite-element biomechanics and population calibration"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.5.4",
    "scikit-fem>=12.0.2",
    "scipy>=1.18.1",
]

[project.scripts]
eyebiomech = "eyebiomech.fem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eyebiomech"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running calibration tests"]

[dependency-groups]
dev = [
    "optiland>=0.6.3",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
